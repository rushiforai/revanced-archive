name: Build

on:
  push:
    branches: ['**']
    paths-ignore: ['**.md', 'assets/**', '.idea/**']
  pull_request:
    paths-ignore: ['**.md', 'assets/**', '.idea/**']
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Keep in sync with `javaVersion` in gradle/libs.versions.toml.
  JAVA_VERSION: 25

jobs:
  build:
    name: Build & test
    # Same-repo PRs are already covered by the push event.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      # Dependency graph submission (Dependabot alerts) on the default branch.
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version-file: bundle/.dvmrc
          cache: true
          cache-hash: ${{ hashFiles('bundle/deno.lock') }}

      # Use a temp key here instead.
      - name: Install the Reseam CLI and a bundle signing key
        run: |
          mkdir -p "$RUNNER_TEMP/reseam"
          version=$(sed -n 's/.*id("app.reseam.workspace") version "\(.*\)".*/\1/p' android/patches/settings.gradle.kts)
          curl -fsSL -o "$RUNNER_TEMP/reseam/reseam" "https://cdn.reseam.app/engine/v$version/reseam-linux-x64"
          chmod +x "$RUNNER_TEMP/reseam/reseam"
          "$RUNNER_TEMP/reseam/reseam" bundle keygen --out "$RUNNER_TEMP/reseam/bundle-signing.key"
          echo "RESEAM_BIN=$RUNNER_TEMP/reseam/reseam" >> "$GITHUB_ENV"
          echo "RESEAM_BUNDLE_KEY=$RUNNER_TEMP/reseam/bundle-signing.key" >> "$GITHUB_ENV"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          dependency-graph: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && 'generate-and-submit' || 'disabled' }}

      - name: Decode keystore
        id: keystore
        env:
          KEYSTORE: ${{ secrets.KEYSTORE }}
        run: |
          if [ -n "$KEYSTORE" ]; then
            echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/signing-key.jks"
            echo "file=$RUNNER_TEMP/signing-key.jks" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::No keystore available, release APK will be unsigned."
          fi

      - name: Build and test
        env:
          KEYSTORE_FILE: ${{ steps.keystore.outputs.file }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ vars.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: >-
          ./gradlew
          :android:assembleDebug
          :android:assembleRelease
          :android:testDebugUnitTest
          :bundle:testBundle
          :android:api:publishToMavenLocal
          :android-patches:bundle

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: '**/build/reports/tests/'
          if-no-files-found: ignore

      - name: Upload APKs
        uses: actions/upload-artifact@v7
        with:
          name: apks
          path: android/build/outputs/apk/*/*.apk
          if-no-files-found: error

      - name: Upload bundle
        uses: actions/upload-artifact@v7
        with:
          name: bundle
          path: bundle/build/bundle/**/*
          if-no-files-found: error

      - name: Upload patch bundle
        uses: actions/upload-artifact@v7
        with:
          name: patches
          path: android/patches/build/reseam/valenced.reseam
          if-no-files-found: error
