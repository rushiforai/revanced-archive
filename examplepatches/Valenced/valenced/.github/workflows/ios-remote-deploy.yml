name: "iOS: Remote IPA Update"

on:
  repository_dispatch:
    types: [ipa-update]

jobs:
  trigger-deploy:
    uses: ./.github/workflows/ios-deploy.yml
    with:
      ipa_url: ${{ github.event.client_payload.ipa_url }}
      is_testflight: ${{ github.event.client_payload.is_testflight }}
      release: true
    secrets: inherit
