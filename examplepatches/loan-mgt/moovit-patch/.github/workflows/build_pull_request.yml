name: Build PR

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main

permissions:
  contents: read
  packages: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    env:
      GH_ACTOR: ${{ secrets.GH_ACTOR }}
      GH_TOKEN: ${{ secrets.GH_TOKEN }}
      ORG_GRADLE_PROJECT_githubPackagesUsername: ${{ secrets.GH_ACTOR }}
      ORG_GRADLE_PROJECT_githubPackagesPassword: ${{ secrets.GH_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Cache Gradle
        uses: burrunan/gradle-cache-action@v2

      - name: Build
        run: ./gradlew build :patches:buildAndroid --no-daemon
